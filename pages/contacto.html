<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AprendeNIIF.Cl | Contacto</title>
    <meta name="description" content="Formulario de contacto de AprendeNIIF.Cl para proponer temas, reportar errores o sugerir mejoras en los recursos de estudio sobre NIIF y NIIF para Pymes.">
    <meta name="keywords" content="NIIF, NIIF para Pymes, normas internacionales de información financiera, contabilidad, auditoría, quizzes NIIF, aprender NIIF, IFRS">

    <!-- Bootstrap 5 CSS (CDN) -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    />
    <!--icono menu de hamburgueza-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">    
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <div>
            <!--Encabezado-->
            <a href="../index.html" class="inline-block" aria-label="Ir al inicio de AprendeNIIF.Cl">
                <img src="../assets/img/logo_blanco.webp" alt="Logo de AprendeNIIF.Cl, plataforma para aprender NIIF (IFRS)" class="inline-block">
            </a>
        </div>
<!-- Checkbox oculto que controla el menú -->
            <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-label="Abrir menú de navegación">

<!-- Icono de hamburguesa (label que activa el checkbox) -->
            <label for="menu-toggle" class="hamburguesa">
            <i class="fa-solid fa-bars"></i>
            </label>
<!-- menu escritorio -->            
        <nav class="menu" aria-label="Navegación principal">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="./pasos.html">Pasos</a></li>
                <li><a href="./normas.html">Normas</a></li>
                <li><a href="./buscador.html">Buscador</a></li>
                <li><a href="./contacto.html">Contacto</a></li>
            </ul>
        </nav>
    <button
    id="toggle-theme"
    class="btn-toggle"
    aria-label="Cambiar tema"
    title="Cambiar tema">
    </button>     
    </header>
    <main>
    <section class="py-5 contacto" aria-labelledby="contacto-titulo">
    <div class="container">
        <h1 id="contacto-titulo" class="centrado">Contáctanos</h1>
        <p class="destacado">Usa este formulario si quieres proponer nuevos temas, reportar algún error en la página o comentar cómo podríamos mejorar los recursos.</p>
        <!-- Formulario con Bootstrap-->
    <form method="post" action="#">
    <div class="mb-3">
        <label for="contactName" class="form-label">Nombre
        </label>
        <input 
            type="text" 
            class="form-control" 
            id="contactName" 
            name="nombre" 
            placeholder="Tu nombre" 
            autocomplete="name" 
            required
        >
    </div>
    <div class="mb-3">
        <label for="contactEmail" class="form-label">Correo Electrónico
        </label>
        <input 
            type="email" 
            class="form-control" 
            id="contactemail" 
            name="email" 
            placeholder="name@example.com" 
            autocomplete="email" 
            required
        >
    </div>
    <div class="mb-3">
        <label for="contactMessage" class="form-label">Mensaje</label>
        <textarea 
            class="form-control" 
            id="contactMessage" 
            name="mensaje" 
            rows="3" 
            required
        ></textarea>
    </div>
    <button type="submit" class="boton">Enviar
    </button>
    </form>
    </div>    
    </section>
    </main>
    <footer>
    © 2025 AprendeNIIF.Cl — Todos los derechos reservados
    </footer>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"
    ></script>
    <script src="../assets/js/theme.js"></script>            
</body>
</html>
